# Roda os testes (guarda, scripts, app e as próprias instruções do assistente) em todo PR e push
# na main, para que nenhuma mudança quebre o harness sem ser percebida. Windows: a guarda e os
# caminhos testados são do Windows, como nas máquinas de quem usa o app.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # test_harness gera zips das versões com git archive

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependências (com o grupo dev)
        run: uv sync --group dev

      - name: Testes
        run: uv run --group dev pytest -ra
